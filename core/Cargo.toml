[package]
name = "xsynth-core"
description = "A fast Rust-based SoundFont synthesizer designed for high voice counts and low latency."
authors = ["Arduano", "MBMS", "Kaydax", "Khangaroo"]
readme = "README.md"

version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
atomic_refcell = "0.1.13"
bytemuck = "1.16.3"
crossbeam-channel = "0.5.13"
lazy_static = "1.5.0"
xsynth-soundfonts = { workspace = true }
rayon = "1.10.0"
spin_sleep = "1.2.1"
to_vec = "0.1.0"
thiserror = "1.0.63"
symphonia = "0.5.4"
biquad = "0.4.2"
simdeez = "3.0.1"
proc-macro2 = "1.0.86"
serde = { version = "1.0", optional = true, features = ["derive"] }
tracy-client = { version = "0.19.0", optional = true, default-features = false, features = [
    "enable",
] }

[features]
serde = ["dep:serde"]
# Tracy 性能剖析插桩：启用后在音频渲染热路径发射 zone（未启动 Tracy 客户端时自动降级为空操作）
tracy = ["dep:tracy-client"]

[dev-dependencies]
midi-toolkit-rs = "0.1.0"
rand = "0.8.5"
criterion = "0.5.1"

[[bench]]
name = "render"
harness = false

[[bench]]
name = "send_events"
harness = false
